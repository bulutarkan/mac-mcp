<!doctype html>
<html><head><meta charset="utf-8"><title>Frames fixture</title>
<style>body{font:14px system-ui;margin:0;padding:16px}.row{margin:10px 0}[role=listbox]{border:1px solid #999;margin:0;padding:0;list-style:none;width:200px}[role=option]{padding:4px;cursor:pointer}</style></head>
<body>
<!-- A dropdown that, like many UI kits, opens its list on the next animation frame. A tab the browser is not
     showing runs no animation frames, so in a background tab the list never opened. -->
<div class="row"><label for="name">Full name</label> <input id="name"></div>
<div class="row"><span id="plan-label">Plan</span>
  <button type="button" id="plan" role="combobox" aria-haspopup="listbox" aria-expanded="false" aria-controls="plan-list"
          aria-labelledby="plan-label">Choose a plan</button>
  <ul role="listbox" id="plan-list" hidden></ul></div>
<script>
var plan=document.getElementById('plan'),list=document.getElementById('plan-list');
plan.addEventListener('click',function(){
  if(!list.hidden){list.hidden=true;plan.setAttribute('aria-expanded','false');return;}
  requestAnimationFrame(function(){
    list.innerHTML='';
    ['Free','Pro','Team'].forEach(function(t){var li=document.createElement('li');li.setAttribute('role','option');li.textContent=t;
      li.addEventListener('click',function(){plan.textContent=t;list.hidden=true;plan.setAttribute('aria-expanded','false');});list.appendChild(li);});
    list.hidden=false;plan.setAttribute('aria-expanded','true');
  });
});
</script>
</body></html>
