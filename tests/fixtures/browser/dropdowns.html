<!doctype html>
<html><head><meta charset="utf-8"><title>Dropdowns fixture</title>
<style>
body{font:14px system-ui;margin:0;padding:0 16px}
nav a,footer a{margin-right:12px}
.row{margin:10px 0;position:relative}
[role=listbox],.menu-portal{border:1px solid #999;margin:0;padding:0;list-style:none;width:200px;background:#fff}
[role=option],.menu-portal .item{padding:4px;cursor:pointer}
.menu-portal{position:absolute}
</style></head>
<body>
<!-- #389: the page's own links share names with options; a dropdown must only ever pick from the list it opened. -->
<nav><a href="#" class="nav" onclick="event.preventDefault();window.__navClicks++">Free</a>
     <a href="#" class="nav" onclick="event.preventDefault();window.__navClicks++">Pro</a></nav>
<h1>Order</h1>
<form onsubmit="return false">
  <div class="row"><label for="name">Full name</label> <input id="name"></div>
  <!-- Named list (aria-controls) without a "Free" option. -->
  <div class="row"><span id="plan-label">Plan</span>
    <button type="button" id="plan" role="combobox" aria-haspopup="listbox" aria-expanded="false" aria-controls="plan-list"
            aria-labelledby="plan-label">Choose a plan</button>
    <ul role="listbox" id="plan-list" hidden><li role="option">Starter</li><li role="option">Business</li></ul></div>
  <!-- No aria-controls: the list is drawn at the end of the page (a portal) only once the button is pressed. -->
  <div class="row"><span id="size-label">Size</span>
    <button type="button" id="size" role="combobox" aria-haspopup="listbox" aria-expanded="false" aria-labelledby="size-label">Choose a size</button></div>
  <!-- Two options with the same name. -->
  <div class="row"><span id="color-label">Color</span>
    <button type="button" id="color" role="combobox" aria-haspopup="listbox" aria-expanded="false" aria-controls="color-list"
            aria-labelledby="color-label">Choose a color</button>
    <ul role="listbox" id="color-list" hidden><li role="option">Red</li><li role="option">Red</li><li role="option">Blue</li></ul></div>
  <div class="row"><label for="note">Note</label> <input id="note"></div>
</form>
<footer><a href="#" onclick="event.preventDefault();window.__footerClicks++">Large</a></footer>
<script>
window.__navClicks=0;window.__footerClicks=0;
function wire(button,list){
  button.addEventListener('click',function(){var open=list.hidden;list.hidden=!open;button.setAttribute('aria-expanded',String(open));});
  Array.from(list.children).forEach(function(o){o.addEventListener('click',function(){
    button.textContent=o.textContent;list.hidden=true;button.setAttribute('aria-expanded','false');});});
}
wire(document.getElementById('plan'),document.getElementById('plan-list'));
wire(document.getElementById('color'),document.getElementById('color-list'));
var size=document.getElementById('size'),portal=null;
size.addEventListener('click',function(){
  if(portal){portal.remove();portal=null;size.setAttribute('aria-expanded','false');return;}
  portal=document.createElement('div');portal.className='menu-portal';
  var r=size.getBoundingClientRect();portal.style.left=r.left+'px';portal.style.top=(r.bottom+window.scrollY)+'px';
  ['Small','Medium','Large'].forEach(function(t){var d=document.createElement('div');d.className='item';d.textContent=t;
    d.addEventListener('click',function(){size.textContent=t;portal.remove();portal=null;size.setAttribute('aria-expanded','false');});
    portal.appendChild(d);});
  document.body.appendChild(portal);size.setAttribute('aria-expanded','true');
});
</script>
</body></html>
