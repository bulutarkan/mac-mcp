name: Verified Release Channel

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-stable-release:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify newest stable release
        run: python3 scripts/verify_release_manifest.py --latest-from HEAD --branch main

      - name: Validate installer syntax
        run: /bin/bash -n install.sh
