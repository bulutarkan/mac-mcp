name: Dependency Audit

on:
  push:
    branches: [main]
    paths:
      - "pyproject.toml"
      - "requirements.lock"
      - "build-requirements.in"
      - ".github/workflows/dependency-audit.yml"
  pull_request:
    branches: [main]
    paths:
      - "pyproject.toml"
      - "requirements.lock"
      - "build-requirements.in"
      - ".github/workflows/dependency-audit.yml"
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Python dependency CVEs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
      - name: Install the locked dependency set and the auditor
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements.lock
          python -m pip install --disable-pip-version-check --no-deps --no-build-isolation -e .
          python -m pip check
          python -m pip install --disable-pip-version-check pip-audit==2.9.0
      - name: Audit the committed lock
        run: pip-audit --progress-spinner off --require-hashes --disable-pip -r requirements.lock
