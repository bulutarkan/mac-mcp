name: Dependency Audit

on:
  push:
    branches: [main]
    paths:
      - "pyproject.toml"
      - ".github/workflows/dependency-audit.yml"
  pull_request:
    branches: [main]
    paths:
      - "pyproject.toml"
      - ".github/workflows/dependency-audit.yml"
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Python dependency CVEs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - name: Install project and auditor
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pip-audit
          python -m pip check
      - name: Audit installed dependencies
        run: pip-audit --progress-spinner off --skip-editable
