name: Quality Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    name: Static validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
      - name: Install lint tools
        run: python -m pip install --disable-pip-version-check ruff
      - name: Python correctness lint
        run: ruff check mcp_server tests --select E9,F63,F7,F82
      - name: Python compile smoke
        run: python -m compileall -q mcp_server tests
      - name: Verify security assurance matrix
        run: python scripts/verify_security_assurance.py --json
      - name: Installer syntax
        run: bash -n install.sh
      - name: OpenAPI JSON syntax
        run: python -m json.tool openapi/custom-gpt-actions.json >/dev/null && python -m json.tool openapi/mac-mcp-v2.json >/dev/null

  types:
    name: Type check
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
      - name: Install
        run: |
          # The runtime dependency set gives mypy real types for FastAPI/MCP; mypy is pinned separately.
          python -m pip install --disable-pip-version-check --require-hashes -r requirements.lock
          python -m pip install --disable-pip-version-check --require-hashes -r requirements-typecheck.lock
      - name: mypy (gradual, modules listed in pyproject.toml)
        run: python -m mypy
