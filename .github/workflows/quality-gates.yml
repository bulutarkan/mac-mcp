name: Quality Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    name: Static validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - name: Install lint tools
        run: python -m pip install --disable-pip-version-check ruff
      - name: Python correctness lint
        run: ruff check mcp_server tests --select E9,F63,F7,F82
      - name: Python compile smoke
        run: python -m compileall -q mcp_server tests
      - name: Verify security assurance matrix
        run: python scripts/verify_security_assurance.py --json
      - name: Installer syntax
        run: bash -n install.sh
      - name: OpenAPI JSON syntax
        run: python -m json.tool openapi/custom-gpt-actions.json >/dev/null
