name: Package

# The Apple Silicon package (#189). On package changes: build an unverified test package and
# check it with scripts/check_pkg.sh (unsigned as documented, payload, release.json, app
# signature, then a real install + upgrade into a temporary HOME). On a published release:
# download the release's own .pkg, match its .sha256, and run the same check on it.
on:
  pull_request:
    paths:
      - "packaging/**"
      - "scripts/build_pkg.sh"
      - "scripts/check_pkg.sh"
      - "requirements.lock"
      - "pyproject.toml"
      - "mcp_server/cli.py"
      - "menu_app/build_app.sh"
      - "menu_app/ServerHelper/**"
      - "tests/test_pkg_staged_install.py"
      - ".github/workflows/package.yml"
  push:
    branches: [main]
    paths:
      - "packaging/**"
      - "scripts/build_pkg.sh"
      - "scripts/check_pkg.sh"
      - "requirements.lock"
      - "pyproject.toml"
      - "mcp_server/cli.py"
      - "menu_app/build_app.sh"
      - "menu_app/ServerHelper/**"
      - "tests/test_pkg_staged_install.py"
      - ".github/workflows/package.yml"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-install:
    if: github.event_name != 'release'
    name: Build and install a test package
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the package (unverified test build)
        run: scripts/build_pkg.sh --allow-unverified
      - name: Check the package
        run: scripts/check_pkg.sh dist/Mac-MCP-*-unverified-*-arm64.pkg

  published:
    if: github.event_name == 'release'
    name: Check the published package
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      # The checker comes from main, so older tags are checked with today's checks.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Download the release package
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-r[0-9]+$ ]]; then
            echo "$TAG is not a package checkpoint (v<version>-r<N>); nothing to check."
            echo "check=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.pkg' --pattern '*.pkg.sha256' --dir "$RUNNER_TEMP/release"
          (cd "$RUNNER_TEMP/release" && shasum -a 256 -c ./*.pkg.sha256)
          echo "check=true" >> "$GITHUB_OUTPUT"
          echo "release_id=stable-${TAG#v}" >> "$GITHUB_OUTPUT"
      - name: Check the published package
        if: steps.release.outputs.check == 'true'
        run: scripts/check_pkg.sh "$RUNNER_TEMP"/release/*.pkg "${{ steps.release.outputs.release_id }}"
