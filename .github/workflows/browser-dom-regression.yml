name: Browser DOM Regression

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium:
    name: Chromium DOM regressions
    runs-on: ubuntu-latest
    env:
      MCP_API_KEY: ci-browser-regression-0123456789abcdef0123456789abcdef
      MAC_MCP_BROWSER_TESTS: "1"
      MAC_MCP_SKIP_MENU_APP_INSTALL: "1"
      MAC_MCP_TELEMETRY_DIR: ${{ runner.temp }}/mac-mcp-browser-telemetry
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install package and optional browser test dependency
        run: python -m pip install -e '.[browser-tests]'
      - name: Install isolated Chromium
        run: python -m playwright install --with-deps chromium
      - name: Run real DOM regressions
        run: python -m unittest discover -s tests -p 'test_browser_*_dom.py' -v
