name: Security Regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip check
      - name: Security and regression suite
        env:
          MAC_MCP_SKIP_MENU_APP_INSTALL: "1"
          MAC_MCP_TELEMETRY_DIR: ${{ runner.temp }}/mac-mcp-telemetry
        run: python -m unittest discover -s tests
      - name: Computer Use conformance smoke
        env:
          MAC_MCP_SKIP_MENU_APP_INSTALL: "1"
        run: python -m mcp_server.cli conformance --json
