name: Security Regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: macos-15
    # Secure bootstrap defaults intentionally fail closed. CI opts into only the
    # capabilities exercised by this regression suite instead of weakening runtime defaults.
    env:
      MCP_API_KEY: "ci-regression-only-0123456789abcdef0123456789abcdef"
      MCP_ALLOW_NO_AUTH: "false"
      MCP_ALLOW_SHELL: "true"
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the floor declared in pyproject.toml (requires-python).
        python-version: ["3.10", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip check
      - name: Security and regression suite
        env:
          MAC_MCP_SKIP_MENU_APP_INSTALL: "1"
          MAC_MCP_TELEMETRY_DIR: ${{ runner.temp }}/mac-mcp-telemetry
        run: python -m unittest discover -s tests
      - name: Computer Use conformance smoke
        env:
          MAC_MCP_SKIP_MENU_APP_INSTALL: "1"
        run: python -m mcp_server.cli conformance --json
