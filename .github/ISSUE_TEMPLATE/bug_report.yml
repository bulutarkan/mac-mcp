name: Bug report
description: Report a reproducible problem in Mac MCP.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please do not include secrets, tokens, cookies, private keys, or private `.env` contents.
        Security vulnerabilities should follow `SECURITY.md` instead of this public form.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for the same problem.
          required: true
        - label: This is not a security vulnerability requiring private disclosure.
          required: true

  - type: input
    id: version
    attributes:
      label: Mac MCP version or commit
      description: For example `2.1.7` or a short commit hash.
      placeholder: 2.1.7
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - MCP server / API
        - Native menu bar app / Settings
        - Safari Visual Companion
        - Chrome Visual Companion
        - Shell / files
        - Browser / Computer Use
        - Delegated agents
        - Mobile dashboard / pairing
        - Installer / update / restart
        - Public endpoint / tunnel
        - Voice
        - Other
    validations:
      required: true

  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: macOS 15.x / 26.x
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the actual behavior and what you expected instead.
      placeholder: |
        Actual:
        Expected:
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Give the smallest reliable sequence that triggers the problem.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Relevant logs or screenshots
      description: Redact credentials and private data before posting.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Mention provider, browser, permission profile, installation method, or recent changes when relevant.
